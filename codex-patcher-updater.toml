version = 1

[vendor]
# Path to the vendored codex repo, relative to workspace root
root = "vendor/codex"
branch = "main"

[tools]
# ast-grep binary; set to "sg" if you prefer the short alias
ast_grep = "ast-grep"
# Optional: coccinelle-for-rust binary, if installed
coccinelle = "coccinelle-for-rust"

[patch_registry]
# Where to store patch-set state
path = "patch-registry/registry.json"

[patches]
# Root directory containing rule files for all engines
rules_root = "rules"

[engines]
# Enable/disable engines globally
ast_grep = true
coccinelle = false
gritql = false

[fork]
# Treat vendor/codex as a fork instead of hard-resetting every run
enabled = false
# Remote/branch that tracks your writable fork
local_remote = "origin"
local_branch = "main"
# Remote/branch that represents upstream; fetch-only by default
upstream_remote = "upstream"
upstream_branch = "main"
# Require clean working tree before modifying anything
require_clean_worktree = true
# Abort (instead of warn) when upstream/local remotes are ahead
abort_on_divergence = true
# When true, automatically fast-forward to upstream if safe
auto_merge_upstream = false
