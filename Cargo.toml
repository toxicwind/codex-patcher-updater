[package]
name = "codex-patcher-updater"
version = "0.5.0"
edition = "2021"
description = "Sovereign codex patcher/updater with ast-grep + coccinelle engines"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
time = { version = "0.3", features = ["formatting"] }
walkdir = "2"

pathdiff = "0.2"

[workspace]
members = ["."]
